name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Require main for manual releases
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Manual releases must run from main."
          exit 1
      - name: Require tagged commit on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main."
            exit 1
          fi
      - name: Verify requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: >-
          bun -e 'const actual = (await Bun.file("package.json").json()).version;
          const requested = process.env.EXPECTED_VERSION ?? "";
          const expected = requested.startsWith("v") ? requested.slice(1) : requested;
          if (actual !== expected) {
            console.error(`Requested ${expected}, package.json contains ${actual}`);
            process.exit(1);
          }'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test and typecheck
        run: bun run check
      - name: Verify package contents
        run: bun pm pack --dry-run
      - name: Publish package with npm trusted publishing
        run: npm publish --access public --ignore-scripts
